<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAANS — School Air Action</title>
<style>
  :root { --bg:#0e0f11; --panel:#16181c; --ink:#e8e6e1; --dim:#9a968e;
          --good:#3f9d5c; --moderate:#d4a017; --poor:#e07a1f; --very_poor:#d03535; --severe:#8a1f1f; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif }
  header { padding:28px 24px 8px; max-width:1080px; margin:0 auto }
  h1 { font-size:22px; letter-spacing:.02em; margin:0 0 6px }
  .sub { color:var(--dim); font-size:13px }
  .langs { margin:14px 0 0 }
  .langs button { background:var(--panel); color:var(--ink); border:1px solid #2a2d33;
                  padding:6px 12px; margin-right:6px; border-radius:6px; cursor:pointer; font:inherit; font-size:13px }
  .langs button.on { border-color:var(--ink) }
  main { max-width:1080px; margin:0 auto; padding:12px 24px 40px;
         display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)) }
  .card { background:var(--panel); border-radius:12px; padding:18px; border-left:6px solid var(--dim) }
  .card .name { font-weight:600; font-size:15px }
  .card .meta { color:var(--dim); font-size:12px; margin-top:2px }
  .row { display:flex; align-items:baseline; gap:10px; margin-top:10px }
  .aqi { font-size:34px; font-weight:700 }
  .band { text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--dim) }
  .action { margin-top:10px; font-size:14px }
  .src { margin-top:12px; font-size:11px; color:var(--dim) }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #2a2d33; margin-right:6px }
  .good { border-left-color:var(--good) } .moderate { border-left-color:var(--moderate) }
  .poor { border-left-color:var(--poor) } .very_poor { border-left-color:var(--very_poor) }
  .severe { border-left-color:var(--severe) }
  footer { max-width:1080px; margin:0 auto; padding:0 24px 48px; color:var(--dim); font-size:12px }
  footer div { margin-top:6px }
  .err { color:#d03535; font-size:13px }
</style>
</head>
<body>
<header>
  <h1>SAANS · School Air Action</h1>
  <div class="sub">What to do today, per school. Updated <span id="updated">…</span> · auto-refresh 60s.</div>
  <div class="langs" id="langs">
    <button data-lang="en" class="on">English</button>
    <button data-lang="hi">हिन्दी</button>
    <button data-lang="te">తెలుగు</button>
  </div>
</header>
<main id="grid"></main>
<footer>
  <div id="limits"></div>
  <div>Advisories are estimates from a regional air-quality model (~11 km grid), not
  measurements at any school. Use your judgment alongside any local reading.</div>
</footer>
<script>
const API = "https://v3btuzxvz0.execute-api.ap-south-1.amazonaws.com/dev";
const SCHOOLS = ["sch-001", "sch-002", "sch-003", "sch-004", "sch-005"];
let LANG = "en";
const bandClass = b => (["good","moderate","poor","very_poor","severe"].includes(b) ? b : "");
// Escape dynamic values before innerHTML: advisory text is model-generated and
// school fields come from data — never inject either raw.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load() {
  const grid = document.getElementById("grid");
  const results = await Promise.all(SCHOOLS.map(id =>
    fetch(`${API}/state/${id}`).then(r => r.json()).catch(e => ({error: String(e), school_id: id}))));
  grid.innerHTML = "";
  for (const d of results) {
    const el = document.createElement("div");
    el.className = "card " + bandClass(d.band);
    if (d.error) {
      el.innerHTML = `<div class="name">${esc(d.school_id)}</div><div class="err">${esc(d.error)}</div>`;
      grid.appendChild(el); continue;
    }
    const advText = (LANG !== "en" && d.advisory_all && d.advisory_all[LANG]) ? d.advisory_all[LANG] : d.advisory;
    const bandLabel = (d.band || "").replace("_", " ");
    el.innerHTML = `
      <div class="name">${esc(d.school_name || d.school_id)}</div>
      <div class="meta">${esc(bandLabel)} · AQI ${Math.round(d.aqi)} (CPCB, PM-based)</div>
      <div class="action">${esc(advText)}</div>
      <div class="src"><span class="badge">advisory: ${esc(d.advisory_source)}</span><span class="badge">reading: ${esc(d.latest_reading ? d.latest_reading.source : "n/a")}</span></div>`;
    grid.appendChild(el);
  }
  document.getElementById("updated").textContent =
    new Date().toLocaleTimeString("en-IN", { hour12: true });
  const lim = (results.find(d => d.limits) || {}).limits;
  if (lim) {
    document.getElementById("limits").textContent =
      `Limits: ${lim.index} · ${lim.data} · residual misclassification ${lim.residual_misclassification_pct}%.`;
  }
}
document.getElementById("langs").addEventListener("click", e => {
  if (e.target.dataset.lang) {
    LANG = e.target.dataset.lang;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b === e.target));
    load();
  }
});
load();
setInterval(load, 60000);
</script>
</body>
</html>
