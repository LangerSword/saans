AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SAANS — School Air Action Notification System. Deployed slice:
  EventBridge -> saans-ingest -> DynamoDB (saans-state) -> saans-api.
  Advisory and SNS bolt on later. Region ap-south-1. Lambdas stay OUT of a VPC
  (no NAT cost; outbound internet to Open-Meteo is fine by default).

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  # The dashboard origin allowed by CORS. NOT "*": the API is public, so the
  # allowed origin is a deploy-time parameter with a real default, and the Lambda
  # reads it from DASHBOARD_ORIGIN. Change it at deploy if the dashboard moves.
  DashboardOrigin:
    Type: String
    Default: "https://saans.langersword.in"
    Description: Origin allowed by CORS on the API (e.g. https://saans.langersword.in). Do not set to "*".

  # API Gateway throttling. Low by default: this is a school dashboard read a few
  # times a minute, not a public high-traffic API. Caps cost and abuse.
  ApiThrottlingRateLimit:
    Type: Number
    Default: 10
    Description: Steady-state requests per second allowed on the API.
  ApiThrottlingBurstLimit:
    Type: Number
    Default: 20
    Description: Burst requests allowed on the API.

  # The Bedrock model for advisory wording: an APAC cross-region inference
  # profile of Amazon's first-party Nova (no Marketplace subscription needed,
  # unlike third-party models). Strands calls it via the Converse API.
  BedrockModelId:
    Type: String
    Default: "apac.amazon.nova-lite-v1:0"
    Description: Inference profile id used by saans-advisory (Strands on Bedrock).
  BedrockFoundationModelId:
    Type: String
    Default: "amazon.nova-lite-v1:0"
    Description: Underlying foundation model for the profile (IAM resource only).

  # Where the demo alert email goes. SNS sends a one-click confirmation first —
  # nothing arrives until that link is clicked.
  AlertEmail:
    Type: String
    Default: "saans-demo@langersword.in"
    Description: Email endpoint for the SNS alert subscription (must be confirmed).

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    # No VpcConfig anywhere: default Lambda networking reaches the internet,
    # which saans-ingest needs for Open-Meteo, and avoids NAT gateway cost.

Resources:

  # ── data ────────────────────────────────────────────────────────────────
  # saans-state: the tier lives here. Only saans-rules writes it. Split from
  # saans-content so the advisory Lambda is physically unable to set a tier
  # (dynamodb:LeadingKeys only constrains the partition key, so a single table
  # could not separate STATE from ADVISORY). See SPEC "Storage design".
  SaansStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "saans-state-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # TTL on the READING sort keys is set at write time (7 days), not here.

  # saans-content: the advisory text lives here. Only saans-advisory writes the
  # item; saans-notify updates ONLY the delivery receipt (alerted_at, delivered)
  # on it. Split from saans-state so no advisory/notify role can write a tier.
  SaansContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "saans-content-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── ingest ──────────────────────────────────────────────────────────────
  # Runs on a schedule: fetch readings, compute CPCB AQI, write STATE.
  SaansIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "saans-ingest-${Environment}"
      CodeUri: src/
      Handler: lambda_ingest.handler
      Environment:
        Variables:
          STATE_TABLE: !Ref SaansStateTable
          AWS_REGION_NAME: ap-south-1
      # Least privilege, hand-scoped: ingest only ever writes readings. A single
      # action on the one table — no AWS-managed policy, no wildcards.
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt SaansStateTable.Arn
      Events:
        # Hourly. EventBridge schedule; no server to run cron on.
        Hourly:
          Type: Schedule
          Properties:
            Schedule: "rate(1 hour)"
            Name: !Sub "saans-ingest-hourly-${Environment}"
            Enabled: true

  # ── rules ───────────────────────────────────────────────────────────────
  # The only writer of the tier. Kept as a separate function so its IAM write
  # scope is narrow and auditable. Invoked by ingest after readings land.
  SaansRulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "saans-rules-${Environment}"
      CodeUri: src/
      Handler: lambda_rules.handler
      Environment:
        Variables:
          STATE_TABLE: !Ref SaansStateTable
          ADVISORY_FUNCTION: !Ref SaansAdvisoryFunction
      # Least privilege, hand-scoped. Was AWS-managed DynamoDBWritePolicy, which
      # both over-granted writes and under-granted reads — the live smoke test
      # caught the missing Query. GetItem/Query read the readings, PutItem for STATE.
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
              Resource: !GetAtt SaansStateTable.Arn
        - Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt SaansAdvisoryFunction.Arn

  # ── alerts ──────────────────────────────────────────────────────────────
  # One topic. The email endpoint needs a one-click confirmation before it
  # receives anything — expected, and part of the setup.
  SaansAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "saans-alerts-${Environment}"

  SaansAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref SaansAlertsTopic

  # ── notify ──────────────────────────────────────────────────────────────
  # The only sender. Applies the dedupe policy, publishes to SNS, writes the
  # delivery receipt back onto the ADVISORY item. NO write action on
  # saans-state — it can never touch a tier.
  SaansNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "saans-notify-${Environment}"
      CodeUri: src/
      Handler: lambda_notify.handler
      Environment:
        Variables:
          CONTENT_TABLE: !Ref SaansContentTable
          SNS_TOPIC_ARN: !Ref SaansAlertsTopic
          DASHBOARD_URL: !Ref DashboardOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt SaansContentTable.Arn
        - Statement:
            - Effect: Allow
              Action: [sns:Publish]
              Resource: !Ref SaansAlertsTopic

  # ── advisory ────────────────────────────────────────────────────────────
  # Words + localizes the advisory (Strands Agents SDK on Bedrock); writes
  # ADVISORY items to saans-content. NO write action on saans-state — the
  # tier physically cannot change here. The deterministic template fallback
  # keeps the alert path alive when the model is throttled or down.
  SaansAdvisoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "saans-advisory-${Environment}"
      CodeUri: src/
      Handler: lambda_advisory.handler
      Timeout: 120
      Environment:
        Variables:
          STATE_TABLE: !Ref SaansStateTable
          CONTENT_TABLE: !Ref SaansContentTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: ap-south-1
          NOTIFY_FUNCTION: !Ref SaansNotifyFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt SaansStateTable.Arn
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem]
              Resource: !GetAtt SaansContentTable.Arn
        # Strands calls Bedrock's Converse APIs. A live AccessDenied named the
        # real permissions: Converse -> bedrock:InvokeModel,
        # ConverseStream -> bedrock:InvokeModelWithResponseStream (the
        # bedrock:Converse* action names are NOT what the API authorizes).
        # Scoped to ONE model: the inference profile + its underlying foundation
        # model. The region wildcard on the foundation-model ARN is AWS's own
        # documented pattern for cross-region inference profiles.
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}"
        - Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt SaansNotifyFunction.Arn

  # ── api ─────────────────────────────────────────────────────────────────
  # Read-only dashboard backend. NO write action on saans-state. CORS is scoped
  # to DashboardOrigin (never "*"), and the stage is throttled.
  SaansApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "saans-api-${Environment}"
      CodeUri: src/
      Handler: lambda_api.handler
      Environment:
        Variables:
          STATE_TABLE: !Ref SaansStateTable
          CONTENT_TABLE: !Ref SaansContentTable
          # Allowlist: the primary origin + the dashboard distribution's own
          # domain (CloudFront default URL until the custom domain is attached).
          DASHBOARD_ORIGINS: !Sub "${DashboardOrigin},https://${SaansDashboardDistribution.DomainName}"
      # Least privilege, hand-scoped: read-only, two tables.
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt SaansStateTable.Arn
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt SaansContentTable.Arn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /state/{school_id}
            Method: get
            RestApiId: !Ref SaansApi

  # Explicit API so throttling + CORS are declared here and auditable, rather
  # than relying on an implicit Serverless API.
  SaansApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Sub "${Environment}"
      Cors:
        AllowOrigin: !Sub "'${DashboardOrigin}'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET'"
      # Throttling on the stage via MethodSettings — every request, key or not.
      # NOT a UsagePlan (it only limits requests carrying an API key; this API is
      # public). NOT a hand-rolled AWS::ApiGateway::Stage either: that collides
      # with the stage SAM already creates for this API, and a hand-rolled
      # Deployment hit "Unresolved resource dependencies" at changeset time —
      # found by the first real deploy attempt 2026-10-12. SAM's native
      # MethodSettings passes straight to the generated stage.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

  # ── dashboard ───────────────────────────────────────────────────────────
  # Static page on S3 behind CloudFront (OAC — the bucket stays private).
  # Files are synced post-deploy: aws s3 sync web/ s3://<bucket>/
  SaansDashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "saans-dashboard-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SaansDashboardOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "saans-dashboard-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SaansDashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-dashboard
            DomainName: !GetAtt SaansDashboardBucket.RegionalDomainName
            OriginAccessControlId: !Ref SaansDashboardOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3-dashboard
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed: CachingOptimized
          AllowedMethods: [GET, HEAD]
          Compress: true

  SaansDashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SaansDashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SaansDashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SaansDashboardDistribution.Id}"

Outputs:
  StateTableName:
    Description: The DynamoDB table holding school state and readings.
    Value: !Ref SaansStateTable
  ApiUrl:
    Description: The read-only dashboard API endpoint.
    Value: !Sub "https://${SaansApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/state/{school_id}"
  DashboardOrigin:
    Description: The origin allowed by CORS.
    Value: !Ref DashboardOrigin
  IngestFunctionArn:
    Value: !GetAtt SaansIngestFunction.Arn
  AdvisoryFunctionArn:
    Value: !GetAtt SaansAdvisoryFunction.Arn
  NotifyFunctionArn:
    Value: !GetAtt SaansNotifyFunction.Arn
  AlertsTopicArn:
    Value: !Ref SaansAlertsTopic
  DashboardBucketName:
    Value: !Ref SaansDashboardBucket
  DashboardUrl:
    Value: !Sub "https://${SaansDashboardDistribution.DomainName}"
